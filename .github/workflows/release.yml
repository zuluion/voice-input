name: Build & Release Executable

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Read Version & Extract Changelog
        id: get_version
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Encoding utf8 -Raw).Trim()
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building version: $ver"

          if (Test-Path CHANGELOG.md) {
              $content = Get-Content CHANGELOG.md -Encoding utf8 -Raw
              $pattern = "(?ms)^##\s*\[$ver\].*?(?=^##\s*\[|\Z)"
              if ($content -match $pattern) {
                  $changelog = $Matches[0].Trim()
                  $changelog | Out-File -FilePath RELEASE_CHANGELOG.md -Encoding utf8
                  Write-Host "Found changelog entry for version $ver"
              } else {
                  "## Release v$ver`n`nAutomated release build for version $ver." | Out-File -FilePath RELEASE_CHANGELOG.md -Encoding utf8
              }
          } else {
              "## Release v$ver`n`nAutomated release build for version $ver." | Out-File -FilePath RELEASE_CHANGELOG.md -Encoding utf8
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "VoiceInput" --paths "." src/main.py

      - name: Compute SHA256 Hash & Update Scoop Manifest
        shell: pwsh
        run: |
          $exePath = "dist/VoiceInput.exe"
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
          "EXE_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SHA256: $hash"

          $json = Get-Content voice-input.json -Encoding utf8 -Raw | ConvertFrom-Json
          $json.version = "$env:VERSION"
          $json.architecture.'64bit'.url = "https://github.com/zuluion/voice-input/releases/download/v$env:VERSION/VoiceInput.exe"
          $json.architecture.'64bit'.hash = "$hash"
          $json | ConvertTo-Json -Depth 10 | Out-File -FilePath voice-input.json -Encoding utf8

      - name: Create GitHub Release with Changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Voice Input v${{ env.VERSION }}
          body_path: RELEASE_CHANGELOG.md
          generate_release_notes: false
          draft: false
          prerelease: false
          files: |
            dist/VoiceInput.exe
            voice-input.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated Scoop Manifest
        shell: pwsh
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add voice-input.json
          $status = git status --porcelain
          if ($status) {
              git commit -m "chore(release): update Scoop manifest for v$env:VERSION [skip ci]"
              git push origin HEAD:$env:GITHUB_REF_NAME
          } else {
              Write-Host "No changes in voice-input.json to commit."
          }
